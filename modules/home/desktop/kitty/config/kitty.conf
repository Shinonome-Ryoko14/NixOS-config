font_family	family="FiraCode Nerd Font"
bold_font	auto
italic_font	auto
bold_italic_font auto

font_size 14

include dracula.conf

# 半透明背景，配合 niri 的 background-effect blur 形成毛玻璃
background_opacity 0.8
dynamic_background_opacity yes

editor nvim

cursor #B794F4
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 8 4
custom_shaders cursor-trail-motion-blur

# 保留 shell integration（prompt 跳转等），但不让它把提示符光标改成细条
shell_integration no-cursor
