# Noctalia 用户模板：让 Noctalia 管理 Waybar 的配色方案
#
# 源模板：~/.config/noctalia/templates/waybar-colors.css
# 输出：  ~/.config/waybar/colors-noctalia.css
#
# 调色板变化时（切换主题 / 壁纸 / 明暗模式）会自动重新渲染。
# post_hook 走防抖脚本 reload-waybar.sh，避免多次重载间隔过短把 waybar 撞崩。
# hooks.toml 里的 colors_changed 钩子会额外补一次重载，防止快速切图时
# 模板应用被合并而漏掉最后一次刷新。
#
# Waybar 的 style.css 固定 @import 本文件，不再提供手写预设切换。

[theme.templates.user.waybar]
input_path  = "$XDG_CONFIG_HOME/noctalia/templates/waybar-colors.css"
output_path = "$XDG_CONFIG_HOME/waybar/colors-noctalia.css"
post_hook   = "bash $HOME/.config/waybar/scripts/reload-waybar.sh || true"
