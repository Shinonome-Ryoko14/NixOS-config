
# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
background_opacity 0.80
# END_KITTY_FONTS

# 光标：kitty 光标只支持单色，无法渐变；用粉色光标 + 蓝色拖影近似粉蓝渐变
cursor #ff9ecd
cursor_text_color #291f14
cursor_trail_color #89b4fa

# 光标拖影（neovide 风格）：只在光标大跳时播放，小移动保持干脆
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 8 4
custom_shaders cursor-trail-motion-blur
